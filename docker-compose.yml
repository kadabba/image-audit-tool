# Имена контейнеров не задаём: container_name занимает имя глобально на весь
# докер-демон и конфликтует с чужими проектами на том же сервере. Compose
# именует их сам в пространстве имён проекта.
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?укажите DB_PASSWORD в .env — см. .env.example}
      POSTGRES_DB: ${DB_NAME:-image_audit}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Порт наружу не пробрасываем: приложение ходит в базу по внутренней сети
    # Docker, а на хосте 5432 нередко уже занят системным postgres.
    # Для ручных запросов есть docker compose exec db psql -U postgres
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Наружу не открываем: проксирует веб-сервер с этой же машины.
    # Порт настраивается — на общем сервере 8000 бывает занят.
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:?укажите DB_PASSWORD в .env — см. .env.example}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-image_audit}
      - ENABLE_DOCS=${ENABLE_DOCS:-true}
      - RETENTION_DAYS=${RETENTION_DAYS:-2}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
