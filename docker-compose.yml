services:
  db:
    image: postgres:15-alpine
    container_name: image-audit-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?укажите DB_PASSWORD в .env — см. .env.example}
      POSTGRES_DB: ${DB_NAME:-image_audit}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: image-audit-tool
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:?укажите DB_PASSWORD в .env — см. .env.example}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-image_audit}
      - ENABLE_DOCS=${ENABLE_DOCS:-true}
      - RETENTION_DAYS=${RETENTION_DAYS:-2}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
